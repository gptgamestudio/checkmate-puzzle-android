name: Build and Host Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-puzzle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Checkmate Chess Puzzle v1.0.0
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## 🎮 Checkmate Chess Puzzle v1.0.0
            - 2D Landscape Mobile Checkmate Game
            - 3D Glossy Bubble Pieces
            - Winner & Loser Character Reactions ("Manalo at Matalo")
            - AdMob Banners & Checkmate Interstitial Ads
            - Download `app-debug.apk` below and install directly on your Android device!
          draft: false
          prerelease: false
